            <div class="slide active">
                <div class="slide-content">
                    <h2 class="slide-title">工具概述</h2>
                    <div class="comparison-overview">
                        <div class="tool-card commercial">
                            <div class="tool-header">
                                <h3>Windsurf</h3>
                                <span class="tool-type commercial">Commercial</span>
                            </div>
                            <div class="tool-features">
                                <ul>
                                    <li><i class="fas fa-check"></i> 完整的 IDE 解決方案</li>
                                    <li><i class="fas fa-check"></i> 多模型支援 (OpenAI, Claude, Gemini)</li>

                                </ul>
                            </div>
                        </div>
                        <div class="vs-divider">
                            <span>VS</span>
                        </div>
                        <div class="tool-card opensource">
                            <div class="tool-header">
                                <h3>Roo-code</h3>
                                <span class="tool-type opensource">Open Source</span>
                            </div>
                            <div class="tool-features">
                                <ul>
                                    <li><i class="fas fa-check"></i> VS Code 擴充套件</li>
                                    <li><i class="fas fa-check"></i> 模型無關性 (BYOM)</li>
                                    <li><i class="fas fa-check"></i> 完全可客製化</li>
                                    <li><i class="fas fa-check"></i> 社群驅動開發</li>
